<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar do Preço</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #0f172a;
    color: white;
}

<header>

<h1>⛽ Radar do Preço</h1>

<p>Compare os preços dos combustíveis em Araguaína</p>

<div class="status">
📍 Araguaína - TO
</div>

</header>

h1 { color: #38bdf8; }

.container { padding: 15px; }

input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: none;
}

.card {
    background: #1e293b;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.price {
    font-size: 20px;
    color: #4ade80;
}

.cheapest {
    border: 2px solid #4ade80;
}

button {
    background: #22c55e;
    border: none;
    padding: 10px;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}
</style>
</head>


<body>

<header>
    <h1>📍 Radar do Preço</h1>
    <p>Encontre o menor preço de Araguaína</p>
</header>

<div class="container">
    <input type="text" id="search" placeholder="Buscar...">
    <select id="filter">
        <option value="all">Todos</option>
        <option value="gasolina">Gasolina</option>
        <option value="mercado">Supermercado</option>
    </select>

    <div id="list">Carregando...</div>
</div>

<script src="app.js"></script>

</body>
</html>
