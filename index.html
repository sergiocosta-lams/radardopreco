<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar do Preço</title>
<link rel="stylesheet" href="style.css">
<style>

body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    background: #0f172a;
    color: white;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px;
}

input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #334155;
    font-size: 16px;
}

.card {
    background: #1e293b;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.price {
    font-size: 22px;
    color: #4ade80;
    font-weight: bold;
}

.cheapest {
    border: 2px solid #4ade80;
}

button {
    background: #22c55e;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}
</style>
</head>


<body>

<header>
    <h1>📡 Radar do Preço</h1>
    <p>Encontre o menor preço de Araguaína</p>
</header>

<div class="container">
    <input type="text" id="search" placeholder="Buscar...">
    <select id="filter">
        <option value="all">Todos</option>
        <option value="gasolina">Gasolina</option>
        <option value="mercado">Supermercado</option>
    </select>

    <div id="list">Carregando...</div>
</div>

<script src="app.js"></script>

</body>
</html>
